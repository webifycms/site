name: webifycms.com

volumes:
  app-data:

networks:
  webifycms-site:
    driver: bridge

services:
  # PHP service
  app:
    container_name: ${APP_ID}-php
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    env_file: .env
    restart: always
    volumes:
      - app-data:/var/www/html
    networks:
      - webifycms-site

  # Nginx service
  server:
    container_name: ${APP_ID}-nginx
    image: nginx:alpine
    volumes:
      - app-data:/var/www/html:ro
      - ./docker/nginx/nginx.caddy.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "${NGINX_PORT}:80"
    restart: always
    networks:
      - webifycms-site
