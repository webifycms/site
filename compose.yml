name: webifycms.com

networks:
  webifycms-site:
    driver: bridge
  webifycms-tools:
    external: true

services:
  # PHP service (development — volume mount overrides the image for live editing)
  app:
    container_name: ${APP_ID}-php
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    restart: always
    working_dir: /var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - webifycms-site
      - webifycms-tools

  # Nginx service
  server:
    container_name: ${APP_ID}-nginx
    image: nginx:alpine
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.ssl.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "${NGINX_PORT}:80"
      - "${NGINX_PORT_SSL}:443"
    restart: always
    networks:
      - webifycms-site
