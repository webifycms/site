name: webifycms.com

networks:
  webifycms-site:
    driver: bridge

services:
  # PHP service (production — uses built image, no volume mount)
  app:
    container_name: ${APP_ID}-php
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    env_file:
      - .env
    restart: always
    working_dir: /var/www/html
    networks:
      - webifycms-site
    volumes:
      - ./runtime:/var/www/html/runtime

  # Nginx service (production)
  server:
    container_name: ${APP_ID}-nginx
    image: nginx:alpine
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/nginx.ssl.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "${NGINX_PORT}:80"
      - "${NGINX_PORT_SSL}:443"
    restart: always
    networks:
      - webifycms-site
